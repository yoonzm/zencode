name: Desktop installers
on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          image=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' -print -quit)
          hdiutil verify "$image"
          mount="$RUNNER_TEMP/zencode-mount"
          mkdir -p "$mount"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          test -x "$mount/ZenCode.app/Contents/MacOS/zencode"
          hdiutil detach "$mount"
      - name: Install and launch Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'ZenCodeTest'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $binary = Join-Path $installDir 'zencode.exe'
          if (!(Test-Path $binary)) { throw 'Installed binary not found' }
          $process = Start-Process -FilePath $binary -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Desktop app exited: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        with:
          name: ZenCode-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
