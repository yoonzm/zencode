name: Desktop installers
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Test build decision rules
        run: python3 -m unittest discover -s test -p '*_test.py'
      - name: Check whether installers already exist for this tag and commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_plan.py
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Configure signed updater artifacts
        shell: python
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.ZENCODE_UPDATER_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          import json, os
          from pathlib import Path
          public = bool(os.environ.get('UPDATER_PUBLIC_KEY', '').strip())
          private = bool(os.environ.get('UPDATER_PRIVATE_KEY', '').strip())
          assert public == private, 'Configure both updater public and private keys'
          assert public or not os.environ['GITHUB_REF'].startswith('refs/tags/'), 'Release builds require updater signing keys'
          Path('updater-build.json').write_text(json.dumps({
              'bundle': {'createUpdaterArtifacts': public and private},
              'plugins': {'updater': {'pubkey': os.environ.get('UPDATER_PUBLIC_KEY', '').strip()}}
          }))
      - run: npm run package -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config updater-build.json
        env:
          ZENCODE_UPDATER_PUBLIC_KEY: ${{ vars.ZENCODE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Name updater artifacts by architecture
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python3 .github/scripts/updater_release.py
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          image=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' -print -quit)
          hdiutil verify "$image"
          mount="$RUNNER_TEMP/zencode-mount"
          mkdir -p "$mount"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount"
          test -x "$mount/ZenCode.app/Contents/MacOS/zencode"
          hdiutil detach "$mount"
      - name: Install and launch Windows package
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'ZenCodeTest'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $binary = Join-Path $installDir 'zencode.exe'
          if (!(Test-Path $binary)) { throw 'Installed binary not found' }
          $process = Start-Process -FilePath $binary -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Desktop app exited: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        with:
          name: ZenCode-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      run_id: ${{ format('{0}', github.run_id) }}
      commit: ${{ github.sha }}
      tag: ${{ github.ref_name }}
